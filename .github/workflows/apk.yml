name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do cp "$f" www/; done
          for f in audio__* art__* fonts__*; do n="${f//__//}"; mkdir -p "www/$(dirname "$n")"; cp "$f" "www/$n"; done
          npm install
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
